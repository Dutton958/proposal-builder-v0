<title>服務建議書編排工具 V0.0</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 公文作業台 — 左側章節樹（如卷宗目錄），右側為當前卷頁；頂列為案號與產出操作 */
:root{
  --bg:#eef1ee; --surface:#ffffff; --sunk:#f6f8f6; --ink:#18211d; --muted:#5a6660; --line:#d5dcd7; --line-strong:#b9c4bd;
  --accent:#24584b; --accent-ink:#ffffff; --accent-soft:#dfece7; --seal:#a23b2a;
  --ok:#2d7a4b; --ok-soft:#e1f1e7; --warn:#a16207; --warn-soft:#fbf0d9; --err:#b42318; --err-soft:#fbe4e1;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-kai:"DFKai-SB","標楷體","BiauKai","Kaiti TC","STKaiti",serif;
  --r:6px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121715; --surface:#1a211e; --sunk:#151b18; --ink:#e4ebe7; --muted:#9aa8a1; --line:#2c3632; --line-strong:#3c4943;
  --accent:#6fb8a3; --accent-ink:#0d1714; --accent-soft:#1f3530; --seal:#e07a66;
  --ok:#6cc48f; --ok-soft:#18301f; --warn:#e2b049; --warn-soft:#33290f; --err:#f08575; --err-soft:#3a1c18; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#121715; --surface:#1a211e; --sunk:#151b18; --ink:#e4ebe7; --muted:#9aa8a1; --line:#2c3632; --line-strong:#3c4943;
  --accent:#6fb8a3; --accent-ink:#0d1714; --accent-soft:#1f3530; --seal:#e07a66;
  --ok:#6cc48f; --ok-soft:#18301f; --warn:#e2b049; --warn-soft:#33290f; --err:#f08575; --err-soft:#3a1c18; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-rows:auto 1fr;min-height:100%}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand .eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.brand h1{font-family:var(--f-display);font-size:18px;margin:0;line-height:1.3;text-wrap:balance}
.top .spacer{flex:1}
.item-pick{display:flex;align-items:center;gap:8px}
.item-pick label{font-size:12px;color:var(--muted)}
select,input[type=text],input[type=number],textarea{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);padding:6px 9px;min-width:0}
textarea{width:100%;resize:vertical;line-height:1.6}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r);padding:7px 13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:3px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--err)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.save-state{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.layout{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:0}
nav.steps{border-right:1px solid var(--line);background:var(--sunk);padding:14px 10px;display:flex;flex-direction:column;gap:2px}
nav.steps button{text-align:left;border:0;background:transparent;padding:9px 12px;border-radius:var(--r);cursor:pointer;display:flex;gap:10px;align-items:baseline}
nav.steps button .n{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
nav.steps button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:500}
nav.steps .navnote{margin-top:auto;font-size:12px;color:var(--muted);padding:10px 12px;line-height:1.5}
main{min-width:0;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.view h2{font-family:var(--f-display);font-size:22px;margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:0;max-width:70ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px}
.panel h3{margin:0 0 12px;font-size:15px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px 16px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--muted)}
.field .note{font-size:12px;color:var(--muted)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13.5px}
.check input{margin-top:4px}
table.data{width:100%;border-collapse:collapse;font-size:13px}
table.data th,table.data td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
table.data th{font-size:12px;color:var(--muted);font-weight:500;background:var(--sunk)}
table.data td input{width:100%}
.scroll-x{overflow-x:auto}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
/* 編排 */
.compose{display:grid;grid-template-columns:330px minmax(0,1fr);gap:18px;align-items:start}
.tree{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 0;position:sticky;top:76px;max-height:calc(100vh - 100px);overflow:auto}
.tree .crit{padding:10px 14px 4px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tree .crit b{font-family:var(--f-display);font-size:14px}
.tree .crit .w{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.tree .ct{padding:2px 14px 2px 22px;font-size:12px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.tree button.slot{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:6px 14px 6px 30px;cursor:pointer;font-size:13px}
.tree button.slot:hover{background:var(--sunk)}
.tree button.slot[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.tree button.slot .sid{font-family:var(--f-mono);font-size:12px}
.tree button.slot .stx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree button.slot.top{padding-left:14px}
.dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line-strong);display:inline-block}
.dot.done{background:var(--ok);border-color:var(--ok)}
.dot.text{background:var(--warn);border-color:var(--warn)}
.cnt{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.editor{display:flex;flex-direction:column;gap:14px;min-width:0}
.req{border-left:3px solid var(--seal);padding:4px 0 4px 12px;font-family:var(--f-kai);font-size:15px;line-height:1.7}
.req .mk{color:var(--seal);font-weight:700}
.req.sub{border-left-color:var(--line-strong)}
.hint{background:var(--warn-soft);color:var(--ink);border-radius:var(--r);padding:8px 12px;font-size:13px}
.drop{border:1.5px dashed var(--line-strong);border-radius:8px;padding:18px;text-align:center;color:var(--muted);background:var(--sunk);cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.drop b{color:var(--ink)}
.files{display:flex;flex-direction:column;gap:8px}
.file{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface)}
.file .thumb{width:56px;height:72px;border:1px solid var(--line);border-radius:4px;background:var(--sunk);object-fit:contain;display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:11px;color:var(--muted);overflow:hidden}
.file .thumb img{width:100%;height:100%;object-fit:contain}
.file .meta{display:flex;flex-direction:column;gap:6px;min-width:0}
.file .row{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.file .row input[type=text]{flex:1 1 220px}
.file .fname{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-family:var(--f-mono);font-size:11px;padding:1px 7px;border-radius:99px;background:var(--sunk);border:1px solid var(--line);color:var(--muted)}
.tag.err{background:var(--err-soft);color:var(--err);border-color:transparent}
details.scope{position:relative}
details.scope summary{list-style:none;cursor:pointer}
details.scope summary::-webkit-details-marker{display:none}
details.scope .pop{position:absolute;z-index:5;top:110%;left:0;background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:10px;min-width:220px;max-height:260px;overflow:auto;box-shadow:0 8px 24px rgb(0 0 0 / .12);display:flex;flex-direction:column;gap:4px}
/* 檢核 */
.issues{display:flex;flex-direction:column;gap:6px}
.issue{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:8px 12px;border-radius:var(--r);font-size:13.5px}
.issue.err{background:var(--err-soft)} .issue.warn{background:var(--warn-soft)} .issue.ok{background:var(--ok-soft)} .issue.info{background:var(--sunk)}
.issue .lv{font-family:var(--f-mono);font-size:11px;font-weight:500;padding-top:2px}
.issue.err .lv{color:var(--err)} .issue.warn .lv{color:var(--warn)} .issue.ok .lv{color:var(--ok)} .issue.info .lv{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--sunk);border-radius:var(--r);padding:10px 12px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums}
table.toc{border-collapse:collapse;width:100%;font-family:var(--f-kai);font-size:13px}
table.toc td,table.toc th{border:1px solid var(--line-strong);padding:5px 7px;vertical-align:top}
table.toc th{background:var(--sunk);font-family:var(--f-body);font-weight:500;font-size:12px}
table.toc td.pg{white-space:nowrap;font-family:var(--f-mono);font-size:12px}
.mark-yes{color:var(--ok);font-weight:700} .mark-no{color:var(--err);font-weight:700}
/* 進度 */
.overlay{position:fixed;inset:0;background:rgb(10 15 13 / .45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.dialog{background:var(--surface);border-radius:10px;padding:22px;width:min(520px,100%);display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgb(0 0 0 / .3)}
.dialog h3{margin:0;font-family:var(--f-display)}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.log{font-family:var(--f-mono);font-size:12px;color:var(--muted);max-height:120px;overflow:auto;white-space:pre-wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;z-index:60;max-width:calc(100% - 32px)}
#stage{position:absolute;left:-30000px;top:0;width:900px}
.kai-test{font-family:var(--f-kai)}
/* 頁面預覽 */
.pv-dialog{width:min(1280px,100%);height:calc(100vh - 32px);display:flex;flex-direction:column;gap:10px}
.pv-scroll{flex:1;min-height:0;overflow:auto;background:var(--sunk);border-radius:8px;padding:16px}
.pv-grid{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;align-items:flex-start}
.pv-card{display:flex;flex-direction:column;gap:6px;align-items:center}
.pv-meta{display:flex;gap:8px;align-items:center;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.pv-page{position:relative;background:#fff;color:#000;box-shadow:0 1px 3px rgb(0 0 0 / .25),0 6px 18px rgb(0 0 0 / .08);overflow:hidden;font-family:"DFKai-SB","標楷體","BiauKai","Kaiti TC","Noto Serif TC",serif}
.pv-area{position:absolute;overflow:hidden;display:flex;flex-direction:column}
.pv-num{position:absolute;left:0;right:0;text-align:center;font-family:"Times New Roman",serif}
.pv-cap{align-self:flex-start;border:1.5px solid #000;font-weight:700;max-width:100%}
.pv-div{border:3px double #000;text-align:center;font-weight:700}
.pv-auto,.pv-form{border:1px dashed #888;padding:4px 6px;color:#333;background:#f7f7f7}
.pv-tbl{border-collapse:collapse;width:100%}
.pv-tbl td,.pv-tbl th{border:1px solid #444;padding:1px 3px;text-align:left}
.pv-busy,.pv-more{font-family:var(--f-body);font-size:11px;color:#666;text-align:center;padding:6px}
.pv-miss{display:flex;align-items:center;justify-content:center;background:#eee;color:#888;font-size:11px}
.pv-over{position:absolute;left:0;right:0;bottom:0;background:#b42318;color:#fff;font-family:var(--f-body);font-size:11px;text-align:center;padding:2px}
@media (max-width: 860px){
  .layout{grid-template-columns:1fr}
  nav.steps{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px 8px}
  nav.steps .navnote{display:none}
  .compose{grid-template-columns:1fr}
  .tree{position:static;max-height:none}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <span class="eyebrow" id="hdr-case">GS15003L · 最有利標</span>
      <span class="tag" style="align-self:flex-start;margin-bottom:2px">V0.0 測試版</span><h1 id="hdr-title">服務建議書編排工具</h1>
    </div>
    <div class="spacer"></div>

      <label for="cur-item">編排項次</label>

      <button data-view="case"><span class="n">01</span>案件與廠商</button>

    <main id="main"></main>

</div>

/* ============================================================
   案件清單：內建＋使用者匯入；案號／案名勾稽；解析採購清單（PDF／Excel／Word）
   ============================================================ */
function allCatalog() {
  const user = (S.userCatalog || []);
  const map = new Map(CATALOG.map(c => [c.no, c]));
  user.forEach(c => { const b = map.get(c.no); map.set(c.no, b ? mergeCase(clone(b), c) : c); });
  return [...map.values()].sort((a, b) => a.no.localeCompare(b.no));
}
function mergeCase(base, add) {
  if (add.title) base.title = add.title; if (add.agency) base.agency = add.agency;
  base.src = [base.src, add.src].filter(Boolean).join("；");
  const byNo = new Map(base.items.map(x => [x.no, x]));
  (add.items || []).forEach(x => { const o = byNo.get(x.no); if (o) { for (const k of ["name", "unit", "price", "qty", "spec"]) if (x[k] && (!o[k] || k !== "name")) o[k] = x[k]; } else { base.items.push({ ...x }); byNo.set(x.no, x); } });
  base.items.sort((a, b) => (+a.no) - (+b.no));
  return base;
}
const normTitle = t => String(t || "").replace(/[「」『』"\s]/g, "").replace(/案$/, "");
/* 勾稽：回傳 { ok, level, msg, fix } */
function caseCheck(no, title) {
  const cat = allCatalog(); const n = String(no || "").trim().toUpperCase(); const t = normTitle(title);
  if (!n && !t) return { ok: false, level: "warn", msg: "尚未選擇案件。" };
  const byNo = cat.find(c => c.no.toUpperCase() === n); const byTitle = cat.find(c => normTitle(c.title) === t);
  if (byNo && normTitle(byNo.title) === t) return { ok: true, level: "ok", msg: `案號 ${byNo.no} 與案名「${byNo.title}」相符（依${byNo.src ? "清單：" + byNo.src : "清單"}）。` };
  if (byNo && byTitle && byNo !== byTitle) return { ok: false, level: "err", msg: `案號與案名錯置：${byNo.no} 的案名應為「${byNo.title}」；「${byTitle.title}」的案號應為 ${byTitle.no}。`, fix: byNo };
  if (byNo) return { ok: false, level: "err", msg: `案號 ${byNo.no} 的案名應為「${byNo.title}」，目前填的是「${title || "（空白）"}」。`, fix: byNo };
  if (byTitle) return { ok: false, level: "err", msg: `案名「${byTitle.title}」的案號應為 ${byTitle.no}，目前填的是 ${no || "（空白）"}。`, fix: byTitle };

/* ---------- 解析 ---------- */
const CASE_NO_RE = /([A-Z]{2}\d{5}[A-Z])/;

const JUNK_NAME = /^(料號|廠牌|型號|件號|行政院|以\s*\d+\s*(公克|毫升)為單位|管理法規|需符合食品|詳如附件|\(空白\)|規格|品名)/;

async function parsePdfList(file, onProg) {

    const hNo = toks.find(t => HDR.no.test(t.s.replace(/\s/g, "")));
    if (hNo) {
      const near = toks.filter(t => Math.abs(t.y - hNo.y) < 40);
      const find = re => near.filter(t => re.test(t.s.replace(/\s/g, ""))).sort((a, b) => a.x - b.x)[0];
      const H = { name: find(HDR.name), spec: find(HDR.spec), unit: find(HDR.unit), price: find(HDR.price), qty: find(HDR.qty) };
      if (H.spec && H.name && H.spec === H.name) H.spec = null;
      const hdrY = Math.max(...near.filter(t => t.y < hNo.y + 28 && !/^\d+\./.test(t.s) && !/^[\d,.]+$/.test(t.s)).map(t => t.y));
      const numToks = toks.filter(t => /^\d{1,3}$/.test(t.s) && t.y > hdrY && Math.abs(t.x - hNo.x) < 30);
      if (H.name && numToks.length) {
        const noX = numToks.reduce((m, t) => Math.max(m, t.x + (t.w || 8)), 0);
        const numHdrs = ["unit", "qty", "price"].filter(k => H[k]).map(k => ({ k, x: H[k].x })).sort((a, b) => a.x - b.x);
        const right = numHdrs.length ? numHdrs[0].x - 14 : 9999;
        const specStarts = toks.filter(t => /^1\.\S/.test(t.s) && t.y > hdrY && t.x > noX + 15 && t.x < right).map(t => t.x);

    nums.forEach((n, i) => {

      else { y0 = i > 0 ? (nums[i - 1].y + n.y) / 2 : top; y1 = i < nums.length - 1 ? (n.y + nums[i + 1].y) / 2 : 1e9; }
      const band = body.filter(t => t.y >= y0 && t.y < y1);
      const nameLines = lineGroup(band.filter(t => inCol(t, "name"))).filter(l => !JUNK_NAME.test(l));
      const first = n => band.filter(t => inCol(t, n)).sort((a, b) => Math.abs(a.y - n.y) - Math.abs(b.y - n.y));
      const pick = k => { const c = band.filter(t => inCol(t, k) && /\d/.test(t.s)).sort((a, b) => Math.abs(a.y - n.y) - Math.abs(b.y - n.y))[0]; return c ? numOnly(c.s) : ""; };

}
function finishRows(rows) {

}
function parseGridRows(grid, allText) {
  let hi = grid.findIndex(r => r.some(c => HDR.no.test(String(c || "").replace(/\s/g, ""))));
  if (hi < 0) return { info: findCaseInfo(allText), items: [] };
  const H = grid[hi].map(c => String(c || "").replace(/\s/g, ""));
  const idx = k => H.findIndex(c => HDR[k].test(c));
  const ci = { no: idx("no"), name: idx("name"), spec: idx("spec"), unit: idx("unit"), price: idx("price"), qty: idx("qty") };
  if (ci.spec === ci.name) ci.spec = -1;

async function parseXlsxList(file) {
  const wb = XLSX.read(await file.arrayBuffer(), { type: "array" }); let best = { info: {}, items: [] }; let text = "";

  wb.SheetNames.forEach(n => { const g = XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: false, defval: "" }); const r = parseGridRows(g, text); if (r.items.length > best.items.length) best = r; });

async function parseDocxList(file) {

async function parseListFile(file, onProg) {
  const ext = (file.name.split(".").pop() || "").toLowerCase();

  else if (["xlsx", "xls", "csv", "ods"].includes(ext)) r = await parseXlsxList(file);

  if (!r.info.no) { const m = file.name.match(CASE_NO_RE); if (m) r.info.no = m[1]; }
  return r;
}

      if (!st.title) notes.push(["err", "未擷取到案名，請手動填寫（例如：麵條類等124項）。"]);

      if (conflictTi) notes.push(["err", `案名「${st.title}」已對應案號 ${conflictTi.no}，與此處 ${st.no} 不同，請確認是否錯置。`]);

      msg,
      h("div", { class: "scroll-x", style: "max-height:260px;overflow:auto" }, h("table", { class: "data" }, h("thead", null, h("tr", null, ["項次", "品名", "預估單價", "規格（摘要）"].map(t => h("th", null, t)))),
        h("tbody", null, items.map(x => h("tr", null, h("td", null, x.no), h("td", null, x.name), h("td", { class: "num" }, x.price || "—"), h("td", { style: "font-size:12px;color:var(--muted)" }, (x.spec || "").slice(0, 60))))))),

    mine.length ? h("div", { style: "display:flex;flex-direction:column;gap:6px" }, h("b", { style: "font-size:13px" }, "已匯入的案件清單"),

  return wrap;

  const amts = COST_ITEMS.map(k => num(c.amt?.[k])); const total = amts.reduce((a, b) => a + b, 0);

/* ---------- 加入檔案 ---------- */
async function addFiles(slotId, fileList) {
  const info = slotInfo(slotId); const scope = slotId === "intro" ? "all" : (info?.slot.scope || "all");
  const added = [];
  for (const file of Array.from(fileList)) {
    const kind = kindOf(file.name);
    const f = { id: uid(), slot: slotId, name: file.name, caption: file.name.replace(/\.[^.]+$/, ""), kind, size: file.size, pages: null,
      items: scope === "item" ? [S.currentItem] : "all", layout: "page", rotate: false, err: null };
    if (kind.startsWith("unsupported")) {
      const ext = kind.split(":")[1];
      f.err = ext === "doc" ? "舊版 .doc 無法在瀏覽器讀取，請用 Word「另存新檔」為 .docx 或 PDF 後再上傳。"
        : ext === "heic" || ext === "heif" ? "HEIC 照片請先轉成 JPG 再上傳（iPhone 可在設定→相機→格式選「最相容」）。"
        : `不支援 .${ext} 檔，請轉成 PDF 後上传。`.replace("上传", "上傳");
    }
    // 依服務建議書規範：每個 PDF 頁面或圖片各自一張 A4；例外：1.1.1 發票每頁A4兩張（評選須知）、公司簡介照片插在文字間
    if (kind === "image" && slotId === "1.1.1") f.layout = "two";
    if (kind === "image" && slotId === "intro") f.layout = "inline";
    await putBlob(f.id, file);
    try { if (file.size < 80e6) f.hash = await sha1(await file.arrayBuffer()); } catch { }
    if (kind === "pdf") {
      try { const d = await openPdf(file); f.pages = d.numPages; d.destroy(); }
      catch (e) { f.err = /password/i.test(e?.name + e?.message) ? "此 PDF 有密碼保護，請先解除密碼再上傳。" : "PDF 無法讀取：" + (e?.message || e); }
    } else if (kind === "xlsx") {
      try { const wb = XLSX.read(await file.arrayBuffer(), { type: "array" }); f.sheets = wb.SheetNames.slice(); f.sheetSel = wb.SheetNames.slice(0, 1); f.pages = null; }
      catch (e) { f.err = "Excel 無法讀取：" + (e?.message || e); }
    } else if (kind === "image") f.pages = 1;
    S.files.push(f); added.push(f);
  }
  save(); return added;
}

function itemsTable(it) {

/* 把一個佐證區塊寫入 body；回傳寫入的段落數 */
function pushBlock(body, b, U, { pbFirst = true, endBm = null } = {}) {
  const d = D(); const { Paragraph, AlignmentType, TextRun, WidthType, BorderStyle } = d;
  const n0 = body.length;
  if (b.type === "group") {
    const us = b.files.map(f => (U.get(f.id) || [])[0]).filter(Boolean); if (!us.length) return 0;
    body.push(captionPara(b.files[0].caption, pbFirst, endBm));
    if (b.layout === "two") us.forEach((u, i) => body.push(imagePara(u, { after: i === 0 ? 8 : 0 })));
    else {
      const half = Math.floor(LY.cwTw / 2); const nob = { style: BorderStyle.NONE, size: 0, color: "FFFFFF" };
      const borders = { top: nob, bottom: nob, left: nob, right: nob, insideHorizontal: nob, insideVertical: nob };
      const mk = i => {
        const f = b.files[i], u = us[i];
        const kids = u ? [imagePara(u), new Paragraph({ style: "TableSmall", alignment: AlignmentType.CENTER, children: [new TextRun({ text: f.caption })] })] : [new Paragraph({ children: [] })];
        return cell(kids, { w: half, borders: { top: nob, bottom: nob, left: nob, right: nob }, margins: { top: 60, bottom: 60, left: 60, right: 60 } });
      };

  const f = b.file;

    body.push(captionPara(f.caption, pbFirst, endBm, false)); body.push(formPlaceholder(f));
    if (f.form === "cost") body.push(bodyPara(`廠商聯絡人姓名：${f.ref.ctName || S.vendor.contact || "　　　　"}　　　聯絡電話：${f.ref.ctTel || S.vendor.tel || "　　　　"}`, { pt: 12, line: 20, before: 6 }));
    return body.length - n0;
  }
  const u = U.get(f.id); if (!u) return 0;

    sheets.forEach((sh, i) => { body.push(captionPara(f.caption + (sheets.length > 1 ? `－${sh.name}` : ""), i === 0 ? pbFirst : true, i === sheets.length - 1 ? endBm : null)); body.push(sheetTable(sh)); });
    return body.length - n0;

  if (f.kind === "image" && f.layout === "inline" && f.slot === "intro") {

    else body.push(new Paragraph({ pageBreakBefore: true, spacing: { line: 20, lineRule: "exact", after: 0 }, children: withBm([new TextRun({ text: "" })], last ? endBm : null) }));

}
function sheetTable(sh) {

  const nC = Math.max(1, ...sh.rows.map(r => r.length));
  const raw = Array.from({ length: nC }, (_, c) => Math.max(2, Math.min(28, Math.max(0, ...sh.rows.map(r => vlen(String(r[c] ?? "")))))));
  const sum = raw.reduce((a, b) => a + b, 0); let W = raw.map(w => Math.max(380, Math.floor(LY.cwTw * w / sum)));
  const k = LY.cwTw / W.reduce((a, b) => a + b, 0); W = W.map(w => Math.floor(w * k));
  const style = nC > 9 ? "TableSmall" : "TableText";
  const covered = new Set(); const span = {};
  sh.merges.forEach(m => { span[m.s.r + ":" + m.s.c] = { rs: m.e.r - m.s.r + 1, cs: Math.min(m.e.c, nC - 1) - m.s.c + 1 };
    for (let r = m.s.r; r <= m.e.r; r++) for (let c = m.s.c; c <= m.e.c; c++) if (r !== m.s.r || c !== m.s.c) covered.add(r + ":" + c); });
  const rows = sh.rows.map((r, ri) => {

    for (let c = 0; c < nC; c++) {

      const sp = span[key]; const txt = String(r[c] ?? "");
      const num = /^[\s$NT\-+]*[\d,]+(\.\d+)?%?$/.test(txt);
      const w = sp ? W.slice(c, c + sp.cs).reduce((a, b) => a + b, 0) : W[c];
      cells.push(cell(tPara(txt, { style, align: num ? AlignmentType.RIGHT : AlignmentType.LEFT, bold: ri === 0 }),
        { w, rowSpan: sp && sp.rs > 1 ? sp.rs : undefined, colSpan: sp && sp.cs > 1 ? sp.cs : undefined, va: VerticalAlign.CENTER, shade: ri === 0 ? "EEF1EE" : undefined }));
    }
    return cells;

  return tableOf(rows, W, { header: true });
}

/* ---------- 產出流程 ---------- */
let lastResult = null;
function imgBytesOf(units) { let n = 0; units.forEach(u => { if (Array.isArray(u)) u.forEach(x => n += x.data.length); }); return n; }
function askChoice(ov, msg, choices, lv = "ok") {
  return new Promise(res => {
    const box = $(".overlay .dialog"); if (!box) return res("cancel");
    const wrap = h("div", { class: "issue " + lv }, h("span", { class: "lv" }, lv === "ok" ? "完成" : "大小"), h("span", null, msg));
    const bar = h("div", { style: "display:flex;flex-direction:column;gap:6px" }, choices.map(([k, t], i) => h("button", { class: "btn" + (i === 0 ? " primary" : ""), style: "justify-content:center;white-space:normal", onclick: () => { wrap.remove(); bar.remove(); res(k); } }, t)));
    box.append(wrap, bar);
  });
}
function askInDialog(ov, msg, yes, no) {
  return new Promise(res => {
    const box = $(".overlay .dialog"); if (!box) return res(false);
    const wrap = h("div", { class: "issue warn" }, h("span", { class: "lv" }, "大小"), h("span", null, msg));
    const bar = h("div", { style: "display:flex;gap:8px;justify-content:flex-end" },
      h("button", { class: "btn", onclick: () => { wrap.remove(); bar.remove(); res(false); } }, no),
      h("button", { class: "btn primary", onclick: () => { wrap.remove(); bar.remove(); res(true); } }, yes));
    box.append(wrap, bar);
  });
}
async function generate(items) {
  if (items.length === 1) { const errs = validate(items[0]).filter(x => x.lv === "err"); if (errs.length) toast(`有 ${errs.length} 個錯誤，仍會產出；送件前請到「檢核與產出」修正。`, 5000); }
  const ov = progressDialog(items.length > 1 ? `產生 ${items.length} 份服務建議書` : "產生服務建議書");
  try {
    for (let n = 0; n < items.length; n++) {
      const it = items[n]; const limit = S.opts.maxMB * 1024 * 1024;
      let preset = { dpi: curDpi(), q: S.opts.enhance ? .92 : .9 };
      while (true) {
        let done = 0; const P = preset;
        if (unitCacheKey !== P.dpi + "|" + P.q + "|" + (S.opts.enhance ? 1 : 0)) { unitCache.clear(); unitCacheKey = P.dpi + "|" + P.q + "|" + (S.opts.enhance ? 1 : 0); }
        const ctx = { get cancelled() { return ov.cancelled; }, total: 1, step(t, k = 1) { done += k; ov.set((n + Math.min(.9, done / this.total) * .85) / items.length, `${itemLabel(it)}｜${P.dpi} dpi${S.opts.enhance ? "｜加強" : ""}｜${t}`); } };
        const units = await buildUnits(it, P, ctx);
        ov.log(`${itemLabel(it)}｜組合 Word 檔（${P.dpi} dpi）…`); await tick();
        const blob = await buildDocx(it, P, units, ctx);
        const img = imgBytesOf(units); const other = Math.max(0, blob.size - img);
        const pages = planPages(it, { unitsByFile: units }).pages;
        const name = `服務建議書_${safeName(S.case.no)}_第${safeName(it.no)}項_${safeName(it.name)}_${safeName(S.vendor.name)}.docx`;
        const info = `${itemLabel(it)}：Word 檔 ${fmtBytes(blob.size)}，內文約 ${pages} 頁，佐證圖片 ${P.dpi} dpi、JPEG 品質 ${Math.round(P.q * 100)}${S.opts.enhance ? "、已加強解析度" : ""}。上限 ${S.opts.maxMB} MB。`;
        const choices = [];
        let up = null, fit = null;
        if (blob.size <= limit) {
          for (const d of [600, 450, 400, 300]) { if (d <= P.dpi) break; const pred = img * (d / P.dpi) ** 2 + other; if (pred <= limit * .95) { up = { dpi: d, q: P.q }; break; } }
          if (!up && P.q < .9) { const pred = img * (QF[.9] / (QF[P.q] || 1)) + other; if (pred <= limit * .95) up = { dpi: P.dpi, q: .9 }; }
          choices.push(["save", "存檔"]);
          if (up) choices.push(["up", `改用 ${up.dpi} dpi、品質 ${Math.round(up.q * 100)} 重新產生（預估 ${fmtBytes(img * (up.dpi / P.dpi) ** 2 * (QF[up.q] / (QF[P.q] || 1)) + other)}）`]);
        } else {
          fit = choosePreset(img, P.dpi, QF[P.q] || 1, limit - other);
          if (fit && !(fit.dpi === P.dpi && fit.q === P.q)) choices.push(["fit", `調整到 ${S.opts.maxMB}MB 內：${fit.dpi} dpi、品質 ${Math.round(fit.q * 100)}（預估 ${fmtBytes(img * (fit.dpi / P.dpi) ** 2 * (QF[fit.q] / (QF[P.q] || 1)) + other)}）`]);
          choices.push(["save", `仍以 ${fmtBytes(blob.size)} 存檔`]);
        }
        choices.push(["cancel", "不存檔"]);
        ov.set((n + 1) / items.length, "");
        const pick = await askChoice(ov, (blob.size > limit ? `超過上限。${info}` + (fit ? "" : `即使降到最低解析度 ${minDpi()} dpi 仍可能超過，建議減少佐證頁數、拆成分冊，或在「版面與備份」放寬上限／調低最低解析度。`) : info), choices, blob.size > limit ? "warn" : "ok");
        if (pick === "up") { preset = up; continue; }

        break;
      }
    }
  } catch (e) { console.error(e); toast(e.message === "已停止" ? "已停止產生" : "產生失敗：" + (e.message || e), 8000); }
  finally { try { ov.close(); } catch { } $$(".overlay").forEach(x => x.remove()); }
}
